<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=480, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pi Display (480x320)</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-header">Settings</div>
    <div class="settings-buttons">
      <button class="settings-btn" id="btn-poweroff" onclick="showConfirm('/api/poweroff')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        Power Off
      </button>
      <button class="settings-btn" id="btn-reboot" onclick="showConfirm('/api/reboot')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        Reboot
      </button>
    </div>
  </div>

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-modal">
      <div class="confirm-message" id="confirm-message">Are you sure you want to execute this command?</div>
      <div class="confirm-buttons">
        <button class="confirm-btn confirm-cancel" onclick="closeConfirm(false)">Cancel</button>
        <button class="confirm-btn confirm-ok" onclick="closeConfirm(true)">Confirm</button>
      </div>
    </div>
  </div>

  <div class="black-screen-overlay" id="black-screen-overlay">
    <div class="black-screen-message" id="black-screen-message"></div>
  </div>

  <div class="carousel" id="carousel">
    <div class="page" id="page-clock">
      <!-- Top bar -->
      <div class="header">
        <div class="location">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>Guatemala City, GT</span>
        </div>
        <div class="status-group">
          <button class="refresh-btn" onclick="location.reload()" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 1 0 2.13-5.83L2 12"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 1 0-2.13 5.83L22 12"></path>
            </svg>
          </button>
          <div class="status-dot" id="live-indicator" title="Network Status"></div>
        </div>
      </div>

      <!-- Center Clock & Date -->
      <div class="time-container">
        <div class="time">
          <span id="hours-mins">--:--</span><span id="seconds" class="seconds"></span><span class="ampm"
            id="ampm"></span>
        </div>
        <div class="date" id="date">Loading date...</div>
        <div class="ip-address" id="ip-address">IP: --</div>
      </div>

      <!-- Bottom Weather Bar -->
      <div class="weather-card">
        <div class="weather-left">
          <div class="weather-icon" id="weather-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 12.5a4.5 4.5 0 0 1 4.5-4.5M8 8a9 9 0 0 1 9 9M8 4a13 13 0 0 1 13 13" />
              <circle cx="5" cy="19" r="2" />
            </svg>
          </div>
          <div class="weather-temp" id="weather-temp">--°C</div>
        </div>
        <div class="weather-right">
          <div class="weather-desc" id="weather-desc">Connecting...</div>
          <div class="weather-extra" id="weather-extra">Waiting for Network</div>
        </div>
      </div>
    </div>

    <div class="page" id="page-dashboard">
      <div class="header">
        <div class="location" style="color: #38bdf8;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>System Monitor</span>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-header">
            <div class="metric-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>
                <line x1="1" y1="9" x2="4" y2="9"></line>
                <line x1="1" y1="14" x2="4" y2="14"></line>
              </svg>
            </div>
            <div class="metric-info">
              <div class="metric-value" id="cpu-val">--%</div>
              <div class="metric-label">CPU Load</div>
            </div>
          </div>
          <div class="metric-graph"><svg id="cpu-graph"></svg></div>
        </div>
        <div class="metric-card">
          <div class="metric-header">
            <div class="metric-icon" style="color: #f59e0b;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
              </svg>
            </div>
            <div class="metric-info">
              <div class="metric-value" id="temp-val">--°C</div>
              <div class="metric-label">Temperature</div>
            </div>
          </div>
          <div class="metric-graph"><svg id="temp-graph"></svg></div>
        </div>
        <div class="metric-card">
          <div class="metric-header">
            <div class="metric-icon" style="color: #a855f7;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M4 6h16v12H4z"></path>
                <path d="M8 6V4"></path>
                <path d="M16 6V4"></path>
                <path d="M4 10h16"></path>
                <path d="M4 14h16"></path>
              </svg>
            </div>
            <div class="metric-info">
              <div class="metric-value" id="ram-val">--%</div>
              <div class="metric-label">Memory</div>
            </div>
          </div>
          <div class="metric-graph"><svg id="ram-graph"></svg></div>
        </div>
        <div class="metric-card">
          <div class="metric-header">
            <div class="metric-icon" style="color: #10b981;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M22 12H2"></path>
                <path
                  d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z">
                </path>
                <line x1="6" y1="16" x2="6.01" y2="16"></line>
                <line x1="10" y1="16" x2="14" y2="16"></line>
              </svg>
            </div>
            <div class="metric-info">
              <div class="metric-value" id="disk-val">--%</div>
              <div class="metric-label">Storage</div>
            </div>
          </div>
          <div class="metric-graph"><svg id="disk-graph"></svg></div>
        </div>
      </div>

      <div class="services-row">
        <div class="service-badge">
          Vaultwarden <span class="badge-status status-down" id="vault-status">Checking</span>
        </div>
        <div class="service-badge">
          Tailscale <span class="badge-status status-down" id="tail-status">Checking</span>
        </div>
      </div>
    </div>
  </div>

  <div class="pagination">
    <div class="dot active" id="dot-clock"></div>
    <div class="dot" id="dot-dashboard"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
